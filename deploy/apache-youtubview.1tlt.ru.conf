<VirtualHost *:80>
    ServerName youtubview.1tlt.ru
    ServerAdmin admin@1tlt.ru

    DocumentRoot /ssd/www/youpubview/public

    <Directory /ssd/www/youpubview/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    # Block direct access to app config / lib / sql
    <DirectoryMatch "^/ssd/www/youpubview/(lib|sql|vendor)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/youtubview.1tlt.ru-error.log
    CustomLog ${APACHE_LOG_DIR}/youtubview.1tlt.ru-access.log combined

    # Certbot will add redirect to HTTPS
</VirtualHost>
